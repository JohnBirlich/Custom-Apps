name: Core tests (C#)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dotnet-test:
    name: C# core tests and WPF build (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run xUnit tests
        run: dotnet test tests/UUF.Core.Tests/UUF.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=core-tests.trx"

      - name: Build WPF app (UUF.App)
        run: dotnet build src/UUF.App/UUF.App.csproj --configuration Release

      - name: Publish WPF app (single file, win-x64)
        run: dotnet publish src/UUF.App/UUF.App.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -o publish/uuf-app

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: uuf-app-win-x64
          path: publish/uuf-app
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: tests/UUF.Core.Tests/TestResults/core-tests.trx
          if-no-files-found: warn
