name: Core tests (C#)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dotnet-test:
    name: C# core tests (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run xUnit tests
        run: dotnet test tests/UUF.Core.Tests/UUF.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=core-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: tests/UUF.Core.Tests/TestResults/core-tests.trx
          if-no-files-found: warn
