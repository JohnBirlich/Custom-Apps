name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  syntax:
    name: Syntax (Windows PowerShell 5.1 and PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse with Windows PowerShell 5.1 (target runtime)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Write-Host ('PSVersion: ' + $PSVersionTable.PSVersion.ToString())
            $targets = @('UniversalUsernameFinder.ps1', 'build/Build-Exe.ps1', 'build/Package-Uuf.ps1')
            $failed = $false
            foreach ($target in $targets) {
              $path = Join-Path $PWD $target
              Write-Host ('Path: ' + $path)
              Write-Host ('Exists: ' + (Test-Path -LiteralPath $path))
              if (-not (Test-Path -LiteralPath $path)) {
                Write-Host ('::error::' + $target + ' is missing')
                $failed = $true
                continue
              }
              $tokens = $null
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
              $parseErrors = @($parseErrors)
              Write-Host ($target + ' parse errors: ' + $parseErrors.Count)
              foreach ($parseError in $parseErrors) {
                $message = $target + ' line ' + $parseError.Extent.StartLineNumber + ': ' + $parseError.Message + ' [' + $parseError.ErrorId + ']'
                Write-Host $message
                Write-Host ('::error::' + $message)
              }
              if ($parseErrors.Count -gt 0) { $failed = $true }
            }
            if ($failed) { exit 1 }
            Write-Host 'Syntax OK.'
          } catch {
            Write-Host ('::error::STEP EXCEPTION: ' + $_.Exception.ToString())
            exit 1
          }

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Write-Host ('PSVersion: ' + $PSVersionTable.PSVersion.ToString())
            $targets = @('UniversalUsernameFinder.ps1', 'build/Build-Exe.ps1', 'build/Package-Uuf.ps1')
            $failed = $false
            foreach ($target in $targets) {
              $path = Join-Path $PWD $target
              if (-not (Test-Path -LiteralPath $path)) {
                Write-Host ('::error::' + $target + ' is missing')
                $failed = $true
                continue
              }
              $tokens = $null
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
              $parseErrors = @($parseErrors)
              Write-Host ($target + ' parse errors: ' + $parseErrors.Count)
              foreach ($parseError in $parseErrors) {
                $message = $target + ' line ' + $parseError.Extent.StartLineNumber + ': ' + $parseError.Message + ' [' + $parseError.ErrorId + ']'
                Write-Host $message
                Write-Host ('::error::' + $message)
              }
              if ($parseErrors.Count -gt 0) { $failed = $true }
            }
            if ($failed) { exit 1 }
            Write-Host 'Syntax OK.'
          } catch {
            Write-Host ('::error::STEP EXCEPTION: ' + $_.Exception.ToString())
            exit 1
          }

      - name: Encoding check (UTF-8 BOM)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $failed = $false
            foreach ($file in @('UniversalUsernameFinder.ps1', 'tests/UniversalUsernameFinder.Tests.ps1', 'build/Build-Exe.ps1', 'build/Package-Uuf.ps1')) {
              $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
              $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              Write-Host ($file + ' BOM: ' + $hasBom)
              if (-not $hasBom) {
                Write-Host ('::error::' + $file + ' has no UTF-8 BOM: Windows PowerShell 5.1 would read Cyrillic as ANSI')
                $failed = $true
              }
            }
            if ($failed) { exit 1 }
            Write-Host 'Encoding OK.'
          } catch {
            Write-Host ('::error::STEP EXCEPTION: ' + $_.Exception.ToString())
            exit 1
          }

  quality:
    name: PSScriptAnalyzer and Pester
    runs-on: windows-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v5

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue } catch { }
            $available = Get-Module -ListAvailable -Name PSScriptAnalyzer | Select-Object -First 1
            if (-not $available) {
              foreach ($attempt in 1..4) {
                try {
                  Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery -AllowClobber -ErrorAction Stop
                  break
                } catch {
                  Write-Host ('Install attempt ' + $attempt + ' failed: ' + $_.Exception.Message)
                  Start-Sleep -Seconds (15 * $attempt)
                }
              }
              $available = Get-Module -ListAvailable -Name PSScriptAnalyzer | Select-Object -First 1
            }
            if (-not $available) {
              Write-Host '::warning::PSScriptAnalyzer is unavailable (PSGallery did not respond); analysis skipped.'
              exit 0
            }
            Import-Module PSScriptAnalyzer
            Write-Host ('PSScriptAnalyzer version: ' + (Get-Module PSScriptAnalyzer).Version.ToString())
            $settings = Join-Path $PWD 'ScriptAnalyzerSettings.psd1'
            $target = Join-Path $PWD 'UniversalUsernameFinder.ps1'
            $results = @(Invoke-ScriptAnalyzer -Path $target -Settings $settings)
            foreach ($result in $results) {
              Write-Host ($result.Severity.ToString() + ' ' + $result.RuleName + ' line ' + $result.Line + ': ' + $result.Message)
            }
            $analyzerErrors = @($results | Where-Object { $_.Severity -eq 'Error' })
            Write-Host ('Total findings: ' + $results.Count + '; errors: ' + $analyzerErrors.Count)
            foreach ($analyzerError in $analyzerErrors) {
              Write-Host ('::error::' + $analyzerError.RuleName + ' line ' + $analyzerError.Line + ': ' + $analyzerError.Message)
            }
            if ($analyzerErrors.Count -gt 0) { exit 1 }
            Write-Host 'Analyzer OK.'
          } catch {
            Write-Host ('::error::STEP EXCEPTION: ' + $_.Exception.ToString())
            exit 1
          }

      - name: Pester (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue } catch { }
            $available = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' } | Select-Object -First 1
            if (-not $available) {
              foreach ($attempt in 1..4) {
                try {
                  Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -Repository PSGallery -AllowClobber -ErrorAction Stop
                  break
                } catch {
                  Write-Host ('Install attempt ' + $attempt + ' failed: ' + $_.Exception.Message)
                  Start-Sleep -Seconds (15 * $attempt)
                }
              }
            }
            Import-Module Pester -MinimumVersion 5.0.0
            Write-Host ('Pester version: ' + (Get-Module Pester).Version.ToString())
            $config = New-PesterConfiguration
            $config.Run.Path = './tests'
            $config.Output.Verbosity = 'Detailed'
            $config.Run.PassThru = $true
            $result = Invoke-Pester -Configuration $config
            Write-Host ('Passed: ' + $result.PassedCount + '; Failed: ' + $result.FailedCount)
            foreach ($failedTest in @($result.Failed)) {
              Write-Host ('::error::TEST FAILED: ' + $failedTest.ExpandedPath + ' -> ' + $failedTest.ErrorRecord.DisplayErrorMessage)
            }
            if ($result.FailedCount -gt 0) { exit 1 }
          } catch {
            Write-Host ('::error::STEP EXCEPTION: ' + $_.Exception.ToString())
            exit 1
          }

      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue } catch { }
            $available = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' } | Select-Object -First 1
            if (-not $available) {
              foreach ($attempt in 1..4) {
                try {
                  Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -Repository PSGallery -AllowClobber -ErrorAction Stop
                  break
                } catch {
                  Write-Host ('Install attempt ' + $attempt + ' failed: ' + $_.Exception.Message)
                  Start-Sleep -Seconds (15 * $attempt)
                }
              }
            }
            Import-Module Pester -MinimumVersion 5.0.0
            Write-Host ('Pester version: ' + (Get-Module Pester).Version.ToString())
            $config = New-PesterConfiguration
            $config.Run.Path = './tests'
            $config.Output.Verbosity = 'Detailed'
            $config.Run.PassThru = $true
            $result = Invoke-Pester -Configuration $config
            Write-Host ('Passed: ' + $result.PassedCount + '; Failed: ' + $result.FailedCount)
            foreach ($failedTest in @($result.Failed)) {
              Write-Host ('::error::TEST FAILED: ' + $failedTest.ExpandedPath + ' -> ' + $failedTest.ErrorRecord.DisplayErrorMessage)
            }
            if ($result.FailedCount -gt 0) { exit 1 }
          } catch {
            Write-Host ('::error::STEP EXCEPTION: ' + $_.Exception.ToString())
            exit 1
          }

  build:
    name: Build UUF.exe (C# launcher)
    runs-on: windows-latest
    needs: quality
    # Publish GitHub Release needs write access to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build executable
        shell: powershell
        env:
          UUF_SIGN_PFX_BASE64: ${{ secrets.UUF_SIGN_PFX_BASE64 }}
          UUF_SIGN_PFX_PASSWORD: ${{ secrets.UUF_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & (Join-Path $PWD 'build\Build-Exe.ps1')
            $exe = Join-Path $PWD 'dist\UUF.exe'
            if (-not (Test-Path -LiteralPath $exe)) {
              Write-Host '::error::Executable was not created: dist\UUF.exe'
              exit 1
            }
            $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
            [System.IO.File]::WriteAllText((Join-Path $PWD 'dist\UUF.exe.sha256'), ($hash + '  UUF.exe'), (New-Object System.Text.UTF8Encoding -ArgumentList $false))
            Write-Host ('SHA256 UUF.exe: ' + $hash)
          } catch {
            Write-Host ('::error::BUILD STEP EXCEPTION: ' + $_.Exception.ToString())
            exit 1
          }

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: uuf-exe
          path: |
            dist/UUF.exe
            dist/UUF.exe.sha256
          if-no-files-found: error

  package:
    name: Package Windows files
    runs-on: windows-latest
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v5

      - name: Download executable
        uses: actions/download-artifact@v5
        with:
          name: uuf-exe
          path: dist

      - name: Build package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & (Join-Path $PWD 'build\Package-Uuf.ps1') | Out-Null
            foreach ($required in @('dist\UniversalUsernameFinder-windows.zip', 'dist\UniversalUsernameFinder-windows.zip.sha256', 'dist\UUF.exe', 'dist\UUF.exe.sha256')) {
              if (-not (Test-Path -LiteralPath (Join-Path $PWD $required))) {
                Write-Host ('::error::missing package file: ' + $required)
                exit 1
              }
            }
          } catch {
            Write-Host ('::error::PACKAGE STEP EXCEPTION: ' + $_.Exception.ToString())
            exit 1
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: UniversalUsernameFinder-windows
          path: |
            dist/UniversalUsernameFinder-windows.zip
            dist/UniversalUsernameFinder-windows.zip.sha256
            dist/UUF.exe
            dist/UUF.exe.sha256
          if-no-files-found: error
          retention-days: 90

      # Publish GitHub Release on tag push (v*): binaries, hashes and installers become
      # one-click release assets. Re-running the same tag overwrites the files instead
      # of failing. The tag commit's dist/ is exactly what this run built, so the
      # release always matches the tag without manual artifact handling.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          assets=()
          for f in dist/UUF.exe dist/UUF.exe.sha256 dist/AppUninstaller.exe dist/AppUninstaller.exe.sha256 dist/UUF-signing.cer build/Install-UUF.ps1 build/Install-UUF.bat build/Uninstall-UUF.ps1 build/Uninstall-UUF.bat; do
            if [ -f "$f" ]; then assets+=("$f"); fi
          done
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'UUFINISHED'
          ## Universal Username Finder __TAG__

          Подбор свободных ников (Roblox, Steam, GitHub, Telegram, Google, Mail.ru, VK, Discord, Outlook и др.), генератор имён, проверка формата, локальный сейф и история.

          ### Быстрая установка
          1. Распакуйте **все** файлы в одну папку.
          2. Двойной клик по `Install-UUF.bat` — установщик проверит зависимости (.NET 4.6.2+, PowerShell 5.1, TLS), положит программу в `%LOCALAPPDATA%\Programs\UniversalUsernameFinder`, сам добавит сертификат Hasberd в доверенные, снимет метку интернета и зарегистрирует приложение в «Приложениях и возможностях».
          3. Запуск — ярлыком с рабочего стола.

          ### Файлы
          | Файл | Назначение |
          |------|-----------|
          | `UUF.exe` | приложение (подписано Authenticode, издатель Hasberd) |
          | `AppUninstaller.exe` | программа полного удаления (файлы, ярлыки, реестр, доверие сертификату, данные — с подтверждением) |
          | `Install-UUF.ps1` / `.bat` | установщик (батник — для двойного клика) |
          | `Uninstall-UUF.ps1` / `.bat` | резервный исходник деинсталлятора |
          | `UUF.exe.sha256`, `AppUninstaller.exe.sha256` | контрольные хэши официальной сборки |
          | `UUF-signing.cer` | публичный ключ самоподписанного сертификата издателя |

          Если SmartScreen показывает красное окно для только что скачанного файла — «Подробнее → Выполнить в любом случае» (или просто запустите установщик: после него предупреждений нет).
          UUFINISHED
          sed -i "s/__TAG__/${TAG}/" "$NOTES_FILE"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Universal Username Finder ${TAG}" --notes-file "$NOTES_FILE"
            if [ ${#assets[@]} -gt 0 ]; then gh release upload "${TAG}" "${assets[@]}" --clobber; fi
            echo "Release ${TAG} updated (re-run on an existing tag)."
          else
            gh release create "${TAG}" --title "Universal Username Finder ${TAG}" --notes-file "$NOTES_FILE" --latest "${assets[@]}"
            echo "Release ${TAG} created with ${#assets[@]} assets."
          fi
