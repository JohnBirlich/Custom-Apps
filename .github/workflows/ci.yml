name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Синтаксис (Windows PowerShell 5.1 и PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Целевая среда приложения — Windows PowerShell 5.1, поэтому проверяем её отдельно:
      # синтаксис, допустимый в PowerShell 7, может не разбираться в 5.1.
      - name: Парсер Windows PowerShell 5.1 (целевая среда)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'UniversalUsernameFinder.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          $parseErrors = @($parseErrors)
          Write-Host ('Проверка в Windows PowerShell ' + $PSVersionTable.PSVersion)
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) {
              Write-Host ('  строка ' + $parseError.Extent.StartLineNumber + ': ' + $parseError.Message)
            }
            throw ('Ошибок синтаксиса: ' + $parseErrors.Count)
          }
          Write-Host 'Синтаксис в порядке.'

      - name: Парсер PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'UniversalUsernameFinder.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          $parseErrors = @($parseErrors)
          Write-Host ('Проверка в PowerShell ' + $PSVersionTable.PSVersion)
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) {
              Write-Host ('  строка ' + $parseError.Extent.StartLineNumber + ': ' + $parseError.Message)
            }
            throw ('Ошибок синтаксиса: ' + $parseErrors.Count)
          }
          Write-Host 'Синтаксис в порядке.'

      - name: BOM и кодировка
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('UniversalUsernameFinder.ps1', 'tests/UniversalUsernameFinder.Tests.ps1')) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw ('В файле ' + $file + ' нет UTF-8 BOM: Windows PowerShell 5.1 прочитает кириллицу как ANSI')
            }
            Write-Host ($file + ': BOM на месте')
          }

  quality:
    name: PSScriptAnalyzer и тесты Pester
    runs-on: windows-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          Import-Module PSScriptAnalyzer
          $settings = Join-Path $PWD 'ScriptAnalyzerSettings.psd1'
          $target = Join-Path $PWD 'UniversalUsernameFinder.ps1'
          $results = @(Invoke-ScriptAnalyzer -Path $target -Settings $settings)
          if ($results.Count -gt 0) {
            $results | Select-Object Severity, RuleName, Line, Message |
              Format-Table -AutoSize | Out-String -Width 220 | Write-Host
          }
          $analyzerErrors = @($results | Where-Object { $_.Severity -eq 'Error' })
          Write-Host ('Замечаний всего: ' + $results.Count + '; ошибок: ' + $analyzerErrors.Count)
          if ($analyzerErrors.Count -gt 0) { throw 'PSScriptAnalyzer нашёл ошибки уровня Error' }

      - name: Pester (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
