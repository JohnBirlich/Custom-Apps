# Выпуск релиза: при публикации релиза на GitHub сборка берётся из ci.yml
# (те же проверки, та же подпись Authenticode), и готовые файлы прикладываются
# к этому релизу. Вручную можно прикрепить файлы к существующему тегу через
# workflow_dispatch.
#
# Сообщения шагов — ASCII (см. комментарий в ci.yml).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег существующего релиза, к которому прикрепить файлы'
        required: true
        type: string

permissions:
  contents: write
  # Нужно для gh run download: скачивание артефакта сборки этого же прогона
  actions: read

jobs:
  ci:
    name: CI and build
    uses: ./.github/workflows/ci.yml

  attach:
    name: Attach files to release
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      # Шаги пишут диагностику через ::notice:: и ::error::, чтобы причина была видна
      # в аннотациях прогона даже без доступа к полному логу.
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n UniversalUsernameFinder-windows -D release-files > download.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::artifact download failed (rc=$rc): $(tr '\n' ' ' < download.log | cut -c1-900)"
            exit 1
          fi
          echo "::notice::downloaded: $(find release-files -type f | tr '\n' ' ')"

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set +e
          echo "::notice::tag=$TAG"
          for required in UUF.exe UUF.exe.sha256 AppUninstaller.exe AppUninstaller.exe.sha256; do
            if [ -z "$(find release-files -type f -name "$required" -print -quit)" ]; then
              echo "::error::missing $required in build artifact"
              exit 1
            fi
          done
          find release-files -type f -print0 | xargs -0 gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber > upload.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::release upload failed (rc=$rc): $(tr '\n' ' ' < upload.log | cut -c1-900)"
            exit 1
          fi
          echo "::notice::attached to release $TAG"
